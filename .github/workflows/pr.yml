name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      # Exclude services for faster e2e setup
      - name: Start and seed Supabase
        run: |
          cp supabase/config.ci.toml supabase/config.toml
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Set Supabase env vars
        run: echo "SUPABASE_SECRET_KEY=$(supabase status --output json | jq -r '.SECRET_KEY')" >> $GITHUB_ENV

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop

